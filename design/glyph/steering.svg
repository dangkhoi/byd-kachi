  <path d="M9.1,12 A2.9,2.9 0 1 1 14.9,12 A2.9,2.9 0 1 1 9.1,12 Z" data-layer="main" fill="var(--light)" stroke="none" data-fx="grad"/>
  <path d="M4.6,10.4 L9.4,11.4 M19.4,10.4 L14.6,11.4 M12,14.8 L12,20.4" data-layer="main" fill="none" stroke="var(--light)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
