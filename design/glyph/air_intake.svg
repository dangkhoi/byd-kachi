<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="96" height="96">
  <!-- CHẾ ĐỘ LẤY GIÓ, CHƯA ĐỌC ĐƯỢC CHIỀU (`ac_cycle` = null) — khoang xe nét CHÍNH + hai vạch gió KHÔNG đầu mũi: có gió, nhưng hình không dám nói trong hay ngoài (luật "không biết ≠ đang tắt"). Cùng khoang xe với ic_recirc / ic_air_fresh nên ba hình là một cặp ba. -->
