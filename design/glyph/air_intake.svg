  <path d="M7.6,13.6 L12.2,13.6 M14.4,13.6 L16.6,13.6" data-layer="sub" fill="none" stroke="var(--ink)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.38"/>
