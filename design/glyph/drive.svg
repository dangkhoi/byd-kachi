  <path d="M12,13.2 L12,7.6" data-layer="main" fill="none" stroke="var(--light)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M9.6,5.6 A2.4,2.4 0 1 1 14.4,5.6 A2.4,2.4 0 1 1 9.6,5.6 Z" data-layer="main" fill="var(--light)" stroke="none" data-fx="grad"/>
