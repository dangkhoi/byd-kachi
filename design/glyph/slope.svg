<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="96" height="96">
  <!-- ĐỘ DỐC (`slope_deg`) — mặt dốc tô chuyển sắc + cung đo góc ở chân dốc: một góc của mặt đường, không phải kim tốc độ. -->
  <style>:root{--ink:#ffffff;--main:#7b5cff;--light:#b39dff;--deep:#7059d7}</style>
  <path d="M3.4,19.4 L20.6,19.4 L20.6,5.2 Z" data-layer="main" fill="var(--light)" stroke="none" data-fx="grad"/>
  <path d="M3.4,19.4 L20.6,19.4" data-layer="main" fill="none" stroke="var(--main)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M9.1,14.68 A7.4,7.4 0 0 1 10.8,19.4" data-layer="sub" fill="none" stroke="var(--ink)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.38"/>
</svg>
