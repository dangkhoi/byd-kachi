<?xml version="1.0" encoding="UTF-8"?>
<!--
  Kachi · HÌNH XE TỔNG HỢP · mặt TRÊN (TOP) — NGUỒN DUY NHẤT của mọi `ic_car_top_*.xml` và của `CarFrames` (mặt trên).
  Spec docs/specs/kachi-visual-refresh.html §4.3 (6 lớp có tên) · §4.8 mức tả thực (1) · R1.
  Hệ toạ độ: ô 24×24 của bộ icon (ô quang học 20×20) — mọi hộp bao CarFrames.partBounds()/wheelBounds() đọc theo hệ này.
  LUẬT SOẠN:
    • chỉ <path d>, <rect>, <circle>, <ellipse> — KHÔNG transform, KHÔNG H/V/S/T/Q tương đối kiểu lạ (script sinh chuẩn hoá về M·L·C·A·Z tuyệt đối).
    • mỗi bộ phận = MỘT phần tử có id; <g data-merge="1" id=…> gộp các con thành MỘT path (nhiều nhánh M), tô even-odd khi có data-evenodd.
    • data-role = vai màu cho tầng vẽ (paint · glass · lamp · drl · turn · tail · glow · tyre · flap · panel · mirror · shadow) — KHÔNG có hex nào chạy vào Kotlin.
    • data-glyph="1" trên lớp = KÝ HIỆU chỉ dùng cho icon 24dp (nhiệt kế, ổ khoá, mũi tên…), không thuộc khung xe của bảng Canvas.
    • data-ref="body" = lớp highlight dùng LẠI hình thân (không phải path mới ⇒ không tính vào trần 28 path).
  Thân xe · 4 bánh · 4 vạt cửa · gương giữ NGUYÊN hình học của bộ U7/U9 (delta hộp bao = 0) để nhãn %/áp suất của bảng không trôi.
  Kính · nóc · rèm · cốp xếp lại thành các Ô KÍNH có mảng (không còn hai vạch) — xem design/NOTES-car.md.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <title>Kachi car · TOP</title>
  <defs>
    <!-- MÀU SƠN: hai stop có id — app thay bằng token carPaintFrom/carPaintTo (design/car/paint.json). Mặc định: Trắng ngọc trai. -->
    <linearGradient id="paint" x1="0" y1="0" x2="0" y2="1">
      <stop id="paintFrom" offset="0" stop-color="#e9eef5"/>
      <stop id="paintTo" offset="1" stop-color="#8d99ab"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#dbe8ff" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#43566e" stop-opacity="0.92"/>
    </linearGradient>
    <radialGradient id="lamp">
      <stop offset="0" stop-color="#eaf3ff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#9dc4ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="taillamp">
      <stop offset="0" stop-color="#ff8a80" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff3d3d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tyre" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a313c"/>
      <stop offset="1" stop-color="#0f1319"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f9ff"/>
      <stop offset="1" stop-color="#a9c6f2"/>
    </linearGradient>
  </defs>

  <!-- 0 · QUẦNG ĐÈN — gradient toả, KHÔNG blur (AC5.2). Vẽ dưới cùng để thân xe đè lên. -->
  <g id="layer-glow">
    <ellipse id="glow_front" data-role="glow" cx="12" cy="4.7" rx="5.4" ry="1.8" fill="url(#lamp)"/>
    <ellipse id="glow_rear" data-role="glowtail" cx="12" cy="20.2" rx="4.8" ry="1.5" fill="url(#taillamp)"/>
  </g>

  <!-- 1 · THÂN — NGUYÊN VĂN TOP_BODY của U7 (x 7.5..16.5 · y 4.6..20.3). Tô = màu sơn, viền trắng 22 %. -->
  <g id="layer-body">
    <path id="body" data-role="paint" d="M12,4.6 C9.9,4.6 8.35,5.4 7.95,7.2 L7.5,10.2 C7.2,12.6 7.2,15.6 7.55,18.1 C7.8,19.7 9.0,20.3 12,20.3 C15.0,20.3 16.2,19.7 16.45,18.1 C16.8,15.6 16.8,12.6 16.5,10.2 L16.05,7.2 C15.65,5.4 14.1,4.6 12,4.6 Z"
          fill="url(#paint)" stroke="#ffffff" stroke-opacity="0.22" stroke-width="0.35"/>
  </g>

  <!-- 2 · KÍNH — kính lái + kính hậu là MẢNG (cung trên giữ đúng cung của U7), 4 ô kính cửa, nóc. -->
  <g id="layer-glass">
    <path id="windscreen" data-role="glass" d="M8.7,8.7 C9.9,7.9 14.1,7.9 15.3,8.7 L15.05,10.4 L8.95,10.4 Z" fill="url(#glass)"/>
    <path id="glass_rear" data-role="glass" d="M8.95,15.2 L15.05,15.2 L15.3,16.6 C14.1,17.4 9.9,17.4 8.7,16.6 Z" fill="url(#glass)"/>
    <rect id="glass_lf" data-role="glass" x="8.6" y="10.6" width="1.1" height="1.8" rx="0.35" fill="url(#glass)"/>
    <rect id="glass_rf" data-role="glass" x="14.3" y="10.6" width="1.1" height="1.8" rx="0.35" fill="url(#glass)"/>
    <rect id="glass_lr" data-role="glass" x="8.6" y="12.9" width="1.1" height="1.9" rx="0.35" fill="url(#glass)"/>
    <rect id="glass_rr" data-role="glass" x="14.3" y="12.9" width="1.1" height="1.9" rx="0.35" fill="url(#glass)"/>
    <rect id="sunroof" data-role="glass" x="10.3" y="10.9" width="3.4" height="3.7" rx="0.8" fill="url(#glass)"/>
    <!-- Rèm: thanh cuộn + tấm phủ có hai nếp gấp khoét rỗng ⇒ MỘT path even-odd (U7 Pass 5 cứu rèm khỏi bị đọc thành kính). -->
    <g id="sunshade" data-role="shade" data-merge="1" data-evenodd="1" fill="#c9d2df">
      <rect x="10.6" y="11.2" width="2.8" height="0.9" rx="0.45"/>
      <rect x="10.8" y="12.4" width="2.4" height="2.0" rx="0.4"/>
      <rect x="11.2" y="13.0" width="1.6" height="0.35" rx="0.17"/>
      <rect x="11.2" y="13.7" width="1.6" height="0.35" rx="0.17"/>
    </g>
  </g>

  <!-- 3 · ĐÈN — cụm trước (pha/cốt chung một thấu kính · DRL · xi-nhan L/R) + cụm sau. -->
  <g id="layer-lights">
    <g id="headlamp" data-role="lamp" data-merge="1" fill="url(#lens)">
      <path d="M8.25,6.45 L9.75,5.0 L10.15,5.75 L8.55,7.05 Z"/>
      <path d="M15.75,6.45 L14.25,5.0 L13.85,5.75 L15.45,7.05 Z"/>
    </g>
    <g id="drl" data-role="drl" data-merge="1" fill="#eaf3ff">
      <path d="M8.6,7.35 L10.2,6.55 L10.35,6.9 L8.75,7.7 Z"/>
      <path d="M15.4,7.35 L13.8,6.55 L13.65,6.9 L15.25,7.7 Z"/>
    </g>
    <path id="turn_l" data-role="turn" d="M7.55,7.9 L8.65,7.35 L8.65,8.45 Z" fill="#ffb74d"/>
    <path id="turn_r" data-role="turn" d="M16.45,7.9 L15.35,7.35 L15.35,8.45 Z" fill="#ffb74d"/>
    <g id="tail" data-role="tail" data-merge="1" fill="#ff5252">
      <path d="M7.85,18.25 L9.6,18.85 L9.45,19.7 L7.95,19.05 Z"/>
      <path d="M16.15,18.25 L14.4,18.85 L14.55,19.7 L16.05,19.05 Z"/>
    </g>
  </g>

  <!-- 4 · BÁNH — NGUYÊN VĂN WHEEL_FL/FR/RL/RR của U7 (rect bo 1.2). Khoá TyreCorner ở CarFrames. -->
  <g id="layer-tyres">
    <rect id="wheel_fl" data-role="tyre" x="3.1" y="6.8" width="2.6" height="4.6" rx="1.2" fill="url(#tyre)"/>
    <rect id="wheel_fr" data-role="tyre" x="18.3" y="6.8" width="2.6" height="4.6" rx="1.2" fill="url(#tyre)"/>
    <rect id="wheel_rl" data-role="tyre" x="3.1" y="13.6" width="2.6" height="4.6" rx="1.2" fill="url(#tyre)"/>
    <rect id="wheel_rr" data-role="tyre" x="18.3" y="13.6" width="2.6" height="4.6" rx="1.2" fill="url(#tyre)"/>
  </g>

  <!-- 5 · CỬA & KHOANG — 4 vạt cửa (NGUYÊN VĂN FLAP_* U9) · cốp · ca-pô · gương. Vạt/cốp/ca-pô chỉ tô khi có trạng thái. -->
  <g id="layer-doors">
    <path id="door_lf" data-role="flap" d="M7.55,9.1 L3.9,10.4 L3.9,13.1 L7.35,12.5 Z" fill="none"/>
    <path id="door_rf" data-role="flap" d="M16.45,9.1 L20.1,10.4 L20.1,13.1 L16.65,12.5 Z" fill="none"/>
    <path id="door_lr" data-role="flap" d="M7.35,13.9 L3.9,15.2 L3.9,17.9 L7.6,17.3 Z" fill="none"/>
    <path id="door_rr" data-role="flap" d="M16.65,13.9 L20.1,15.2 L20.1,17.9 L16.4,17.3 Z" fill="none"/>
    <rect id="bonnet" data-role="panel" x="9.5" y="5.6" width="5.0" height="2.0" rx="0.9" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="0.25"/>
    <rect id="boot" data-role="panel" x="9.2" y="17.7" width="5.6" height="1.9" rx="0.8" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="0.25"/>
    <g id="mirror" data-role="mirror" data-merge="1" fill="#6b788a">
      <path d="M7.6,8.9 L4.7,9.7 L7.4,10.9 Z"/>
      <path d="M16.4,8.9 L19.3,9.7 L16.6,10.9 Z"/>
    </g>
  </g>

  <!-- 6 · HIGHLIGHT — dùng LẠI thân, chỉ viền theo tone (CarPartStyle: ẩn · ACCENT_LINE · AMBER · RED). -->
  <g id="layer-highlight">
    <path id="highlight" data-role="highlight" data-ref="body" fill="none" stroke="#4c7dff" stroke-width="0.5"/>
  </g>

  <!-- KÝ HIỆU (chỉ icon 24dp) — không phải bộ phận xe, không vào khung của bảng Canvas. -->
  <g id="layer-glyph" data-glyph="1" fill="#ffffff">
    <path id="lock_shackle" data-stroke="1" d="M10.7,11.9 L10.7,10.8 A1.3,1.3 0 0 1 13.3,10.8 L13.3,11.9" fill="none" stroke="#ffffff"/>
    <rect id="lock_body" x="9.7" y="11.9" width="4.6" height="3.5" rx="0.8"/>
    <g id="seat_fl" data-merge="1">
      <rect x="8.6" y="9.2" width="2.6" height="2.2" rx="0.6"/>
      <rect x="8.8" y="11.7" width="2.2" height="1.0" rx="0.45"/>
    </g>
    <path id="therm_stem" data-stroke="1" d="M12,9.6 L12,12.9" fill="none" stroke="#ffffff"/>
    <circle id="therm_bulb" cx="12" cy="14.3" r="1.35"/>
    <rect id="sunroof_gap" x="10.8" y="11.3" width="2.4" height="1.0" rx="0.4"/>
    <path id="arrow_v_stem" data-stroke="1" d="M12,16.6 L12,17.8" fill="none" stroke="#ffffff"/>
    <g id="arrow_v_heads" data-merge="1">
      <path d="M12,15.1 L13.34,16.59 L10.66,16.59 Z"/>
      <path d="M12,19.3 L10.66,17.81 L13.34,17.81 Z"/>
    </g>
    <g id="chev_front" data-merge="1">
      <path d="M9.1,9.85 L11.5,10.7 L9.1,11.55 Z"/>
      <path d="M14.9,9.85 L12.5,10.7 L14.9,11.55 Z"/>
    </g>
    <g id="chev_rear" data-merge="1">
      <path d="M9.1,16.45 L11.5,17.3 L9.1,18.15 Z"/>
      <path d="M14.9,16.45 L12.5,17.3 L14.9,18.15 Z"/>
    </g>
    <g id="dots" data-merge="1">
      <circle cx="9.8" cy="14.0" r="0.5"/>
      <circle cx="11.8" cy="14.0" r="0.85"/>
      <circle cx="13.95" cy="14.0" r="1.25"/>
    </g>
    <path id="drop" d="M12,11.5 C13.12,12.47 13.55,13.5 13.55,14.35 A1.55,1.55 0 0 1 10.45,14.35 C10.45,13.5 10.88,12.47 12,11.5 Z"/>
    <circle id="note_head" cx="11.25" cy="15.2" r="0.95"/>
    <path id="note_stem" data-stroke="1" d="M12.1,15.1 L12.1,12.2 C13.3,12.5 13.9,13.1 13.95,13.9" fill="none" stroke="#ffffff"/>
  </g>
</svg>
